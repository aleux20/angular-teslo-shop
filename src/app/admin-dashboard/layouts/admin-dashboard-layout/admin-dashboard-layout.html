<div
  class="bg-slate-900 flex h-screen w-screen overflow-hidden antialiased text-slate-300 selection:bg-blue-600 selection:text-white"
>
  <!-- Sidebar / Menú lateral (Responsivo: Oculto en móvil, fijo en pantallas medianas en adelante) -->
  <aside
    id="menu"
    class="bg-gray-900 w-64 h-full flex flex-col justify-between border-r border-slate-800 z-20 shrink-0"
  >
    <!-- Seccion Superior: Logo y Perfil -->
    <div>
      <!-- Logo -->
      <div id="logo" class="my-6 px-6">
        <h1
          routerLink="/"
          class="text-xl md:text-2xl font-bold text-white font-montserrat cursor-pointer"
        >
          Teslo<span class="text-blue-500">Shop</span>
        </h1>
        <p class="text-slate-500 text-xs mt-1">Manage your actions and activities</p>
      </div>

      <!-- Perfil de usuario -->
      <div id="profile" class="px-6 pb-6 border-b border-slate-800">
        <p class="text-slate-500 text-xs mb-2">Bienvenido</p>
        <a href="#" class="inline-flex space-x-3 items-center group">
          <img
            class="rounded-full w-9 h-9 object-cover ring-2 ring-blue-500/30 group-hover:ring-blue-500 transition-all"
            src="https://images.unsplash.com/photo-1542909168-82c3e7fdca5c?ixlib=rb-4.0.3&auto=format&fit=crop&w=128&q=80"
            alt="Avatar de usuario"
          />
          <span class="text-sm md:text-base font-semibold text-white truncate max-w-32.5">
            {{ user()?.fullName || 'Administrador' }}
          </span>
        </a>
      </div>

      <!-- Enlaces de Navegación -->
      <nav id="nav" class="w-full px-4 mt-4 space-y-1">
        <a
          routerLink="/admin/dashboard"
          class="w-full px-3 py-2.5 rounded-xl inline-flex space-x-3 items-center text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-150"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z"
            />
          </svg>
          <div class="flex flex-col">
            <span class="text-sm font-medium leading-tight">Dashboard</span>
            <span class="text-xs text-slate-500 hidden md:block">Data Overview</span>
          </div>
        </a>

        <a
          routerLink="/admin/products"
          routerLinkActive="bg-blue-600 text-white shadow-lg shadow-blue-600/20"
          class="w-full px-3 py-2.5 rounded-xl inline-flex space-x-3 items-center text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-150"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 0v3.75m-16.5-3.75v3.75m16.5 0v3.75C20.25 16.153 16.556 18 12 18s-8.25-1.847-8.25-4.125v-3.75m16.5 0c0-2.278-3.694-4.125-8.25-4.125s-8.25-1.847-8.25-4.125"
            />
          </svg>
          <div class="flex flex-col">
            <span class="text-sm font-medium leading-tight">Productos</span>
            <span class="text-xs text-slate-500 hidden md:block">Listado de productos</span>
          </div>
        </a>
      </nav>
    </div>

    <!-- Sección Inferior: Botón de Cerrar Sesión -->
    <div class="p-4 border-t border-slate-800">
      <button
        (click)="authService.logout()"
        class="btn btn-ghost btn-sm text-error hover:bg-error/10 w-full justify-start gap-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
          />
        </svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 h-full overflow-y-auto bg-slate-800 p-6 md:p-8">
    <router-outlet />
  </main>
</div>
