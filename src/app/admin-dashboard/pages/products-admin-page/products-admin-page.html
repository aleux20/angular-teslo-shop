<!-- Encabezado de la Sección -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Listado de productos</h1>
    <p class="text-sm text-base-content/60 mt-1">
      Total de productos registrados:
      <span class="badge badge-accent badge-sm font-semibold ml-1">
        {{ productsResource.value()?.count ?? 0 }}
      </span>
    </p>
  </div>

  <!-- Botón de Acción Principal -->
  <a routerLink="/admin/products/new" class="btn btn-primary gap-2 shadow-md">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.5"
      stroke="currentColor"
      class="w-5 h-5"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
    </svg>
    Nuevo producto
  </a>
</div>

<div class="divider my-2"></div>

<!-- Estados de Carga, Error y Contenido -->
@if (productsResource.isLoading()) {
  <div class="flex flex-col justify-center items-center py-24 gap-3">
    <span class="loading loading-spinner loading-lg text-primary"></span>
    <span class="text-sm text-base-content/50">Cargando inventario...</span>
  </div>
} @else if (productsResource.error()) {
  <div class="alert alert-error shadow-lg max-w-lg mx-auto my-12">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="stroke-current shrink-0 h-6 w-6"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span>No fue posible cargar los productos.</span>
    <button class="btn btn-sm btn-ghost" (click)="productsResource.reload()">Reintentar</button>
  </div>
} @else {
  <!-- Barra de Herramientas / Filtros -->
  <div
    class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 bg-base-100 p-4 rounded-box shadow-sm border border-base-200"
  >
    <div class="flex items-center gap-2">
      <label for="perPageSelect" class="text-sm text-base-content/70 font-medium">Mostrar:</label>
      <select
        id="perPageSelect"
        class="select select-bordered select-sm w-24"
        [value]="productsPerPage()"
        (change)="onProductsPerPageChange($event)"
        aria-label="Productos por página"
      >
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <span class="text-sm text-base-content/70">por página</span>
    </div>

    <!-- Espacio reservado por si en el futuro quieres añadir un buscador rápido -->
  </div>

  <!-- Componente de Tabla -->
  <app-product-table [products]="productsResource.value()?.products ?? []" />

  <!-- Paginación Centrada -->
  <div class="flex justify-center mt-8">
    <app-pagination
      [pages]="productsResource.value()?.pages ?? 0"
      [currentPage]="paginationService.currentPage()"
    />
  </div>
}
