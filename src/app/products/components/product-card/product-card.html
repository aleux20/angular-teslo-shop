<div
  class="card bg-base-100 border border-base-200 shadow-sm hover:shadow-md transition-all duration-300 group overflow-hidden"
>
  <figure class="relative overflow-hidden bg-base-200">
    <img
      class="h-56 w-full object-cover group-hover:scale-105 transition-transform duration-300"
      [src]="product().images | productImage"
      [alt]="product().title"
    />
  </figure>

  <div class="card-body p-5 flex flex-col justify-between">
    <div class="space-y-2">
      <h2
        class="card-title font-montserrat text-lg font-bold line-clamp-1 group-hover:text-primary transition-colors"
      >
        <a [routerLink]="['/product', product().slug]">
          {{ product().title }}
        </a>
      </h2>

      <p class="text-sm text-base-content/70 line-clamp-2">
        {{ product().description }}
      </p>
    </div>

    <div class="card-actions items-center justify-between mt-4 pt-3 border-t border-base-200">
      <span class="text-lg font-bold text-primary">
        {{ product().price | currency: 'USD' }}
      </span>

      <a class="btn btn-primary btn-sm gap-1" [routerLink]="['/product', product().slug]">
        Ver producto
      </a>
    </div>
  </div>
</div>
